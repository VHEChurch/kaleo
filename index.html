<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="icon" type="image/png" sizes="192x192" href="icons/kaleo-icon-192.png">
<link rel="apple-touch-icon" href="icons/kaleo-icon-180.png">
<title>Kaleo · Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500&display=swap">
<style>
/* Kaleo · page d'invitation (code à incruster dans Google Sites)
   Mise en page : récit sur fond vert VH à gauche, carte-formulaire blanche à droite ; une seule colonne sur téléphone. */
:root{
  --vh:#006C67;        /* Vert VH, Pantone 7719 C */
  --vh-deep:#00423F;
  --vh-ink:#0B2B29;
  --gold:#D2AF1F;      /* Jaune doré, Pantone 7752 C */
  --gold-deep:#B8961A;
  --warm:#D6D1CB;      /* Warm Gray 1 C */
  --warm-soft:#F3F1EE;
  --turq:#00A7B5;      /* Accent : bleu turquoise 7710 C */
  --red:#B21E28;       /* Rouge pourpre 7621 C (erreurs) */
  --paper:#FFFFFF;
  --font:"Montserrat","Gotham","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--font);font-size:16px;line-height:1.5;color:var(--paper);
  background:radial-gradient(120% 90% at 0% 0%,#00807A 0%,var(--vh) 38%,var(--vh-deep) 100%) fixed,var(--vh-deep);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.ribbon{position:fixed;top:-140px;right:-190px;width:560px;height:560px;transform:rotate(15deg);opacity:.5;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 28px max(18px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
/* Logo Kaleo en blanc (lettres blanches, trait et flèche or) posé sur le fond vert. Le slogan est du texte, traduit avec la page. */
.brand{width:min(100%,270px);display:grid;gap:12px;container-type:inline-size}
.brand img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.22))}
.tagline{display:flex;align-items:center;justify-content:space-between;gap:3px;margin:0;padding:0 0 0 3%;font-weight:700;font-size:3.3cqw;line-height:1;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.92);white-space:nowrap}
.tagline i{flex:none;width:.62em;height:.62em;border-radius:50%;background:var(--gold)}
@media (max-width:560px){.top{flex-direction:column-reverse;align-items:stretch;gap:14px}.lang{align-self:flex-end}.brand{width:min(100%,255px)}}
.lang{display:inline-flex;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:3px}
.lang button{font:700 12px/1 var(--font);letter-spacing:.12em;color:#fff;background:none;border:0;border-radius:999px;padding:8px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--vh)}
.lang button:focus-visible,.btn:focus-visible,.link:focus-visible,.rm:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.grid{display:grid;grid-template-columns:1fr;gap:28px;margin-top:30px;align-items:start}
@media (min-width:800px){.grid{grid-template-columns:1.02fr 1fr;gap:56px;margin-top:48px}.hero{position:sticky;top:24px}}

.eyebrow{font-weight:800;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
h1{font-weight:900;font-size:clamp(34px,6.2vw,58px);line-height:1.02;letter-spacing:-.015em;margin:0 0 18px;text-wrap:balance}
h1 em{font-style:normal;color:var(--gold)}
.lead{font-size:17px;color:rgba(255,255,255,.86);max-width:44ch;margin:0 0 26px}
.event{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding:16px 18px;border-radius:16px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.12);max-width:440px}
.event svg{grid-row:span 2;width:30px;height:30px}
.event b{font-weight:800;font-size:16px;color:#fff}
.event span{font-size:14px;color:rgba(255,255,255,.75)}
.verse{margin:26px 0 0;font-size:15px;color:rgba(255,255,255,.8)}
.verse q{display:block;font-style:italic;font-weight:500;font-size:24px;color:#fff;quotes:none;margin-bottom:2px}
.verse cite{font-style:normal;font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}

.card{background:var(--paper);color:var(--vh-ink);border-radius:24px;padding:26px 22px 22px;box-shadow:0 30px 60px -28px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.4) inset}
@media (min-width:420px){.card{padding:30px 28px 26px}}
.demo{display:inline-block;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--vh);background:#E3F1F0;border-radius:999px;padding:5px 10px;margin-bottom:14px}
.field{display:grid;gap:7px}
label,.legend{font-weight:700;font-size:14px;color:var(--vh-ink)}
.hint{font-size:13px;color:#5E6B6A;margin:-2px 0 0}
input[type=text],input[type=tel]{width:100%;height:52px;font:500 16px var(--font);color:var(--vh-ink);background:var(--warm-soft);border:1.5px solid transparent;border-radius:13px;padding:0 15px;transition:border-color .15s,background .15s,box-shadow .15s}
input::placeholder{color:#97A09F;font-weight:400}
input:hover{border-color:var(--warm)}
input:focus{outline:none;background:#fff;border-color:var(--vh);box-shadow:0 0 0 4px rgba(0,108,103,.14)}
input[aria-invalid="true"]{border-color:var(--red);background:#FFF6F6}
.err{font-size:13px;font-weight:600;color:var(--red);min-height:0}
.err:empty{display:none}

.section{margin-top:24px;padding-top:22px;border-top:1px solid #ECE9E5}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.count{font-size:12px;font-weight:700;color:#7A8584;font-variant-numeric:tabular-nums}
.guests{display:grid;gap:14px}
.guest{border:1.5px solid #ECE9E5;border-radius:16px;padding:14px;display:grid;gap:10px;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.guest-head{display:flex;align-items:center;justify-content:space-between}
.tag{font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--vh)}
.rm{font:600 13px var(--font);color:#6B7675;background:none;border:0;padding:4px 6px;border-radius:8px;cursor:pointer}
.rm:hover{color:var(--red);background:#FFF1F1}
.guest-fields{display:grid;gap:10px}
@media (min-width:520px){.guest-fields{grid-template-columns:1.1fr 1fr}}
.link{margin-top:12px;font:700 14px var(--font);color:var(--vh);background:none;border:1.5px dashed #BFD9D7;border-radius:13px;width:100%;height:48px;cursor:pointer;transition:background .15s,border-color .15s}
.link:hover{background:#F0F7F6;border-color:var(--vh)}
.link[hidden]{display:none}

.consent{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;margin-top:22px;font-size:14px;font-weight:500;color:#33403F;cursor:pointer}
.consent input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:2px solid #A9B3B2;border-radius:7px;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.consent input:checked{background:var(--vh);border-color:var(--vh)}
.consent input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.consent input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.consent input[aria-invalid="true"]{border-color:var(--red)}

.btn{margin-top:20px;width:100%;height:58px;border:0;border-radius:15px;background:var(--gold);color:var(--vh-ink);font:800 16px var(--font);letter-spacing:.01em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .15s,transform .1s;box-shadow:0 10px 22px -12px rgba(184,150,26,.9)}
.btn:hover{background:#DDBB2C}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.7;cursor:progress}
.spin{width:18px;height:18px;border:2.5px solid rgba(11,43,41,.25);border-top-color:var(--vh-ink);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.privacy{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:#6B7675;margin:16px 0 0}
.privacy svg{flex:none;width:15px;height:15px;margin-top:2px}
.form-err{margin-top:14px;padding:12px 14px;border-radius:12px;background:#FFF1F1;color:var(--red);font-size:14px;font-weight:600}
.form-err:empty{display:none}

.done{text-align:left}
.done-mark{width:64px;height:64px;border-radius:50%;background:var(--vh);display:grid;place-items:center;margin-bottom:18px;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.done h2{font-weight:900;font-size:30px;line-height:1.1;margin:0 0 10px;color:var(--vh-ink);text-wrap:balance}
.done p{margin:0 0 10px;color:#33403F}
.done .when{display:inline-block;margin:8px 0 4px;padding:8px 12px;border-radius:10px;background:var(--warm-soft);font-weight:700;font-size:14px;color:var(--vh)}
.btn.ghost{background:#fff;border:2px solid var(--vh);color:var(--vh);box-shadow:none}
.btn.ghost:hover{background:#F0F7F6}

.sign{margin-top:34px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14);display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 18px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.sign b{color:var(--gold);font-weight:800}
.sign a{color:rgba(255,255,255,.72);text-decoration:none;letter-spacing:.06em;text-transform:none;font-weight:600}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

        <b id="eventDate"></b>
        <span data-t="address"></span>
      </div>
      <p class="verse"><q data-t="verse"></q><cite data-t="verseRef"></cite></p>
    </section>

    <section class="card" aria-live="polite">
      <form id="form" novalidate>
        <span class="demo" id="demoTag" hidden data-t="demo"></span>
        <div class="field">
          <label for="inviter" data-t="yourName"></label>
          <p class="hint" id="inviterHint" data-t="yourNameHint"></p>
          <input id="inviter" name="inviter" type="text" autocomplete="name" maxlength="80" aria-describedby="inviterHint inviterErr">
          <span class="err" id="inviterErr"></span>
        </div>

        <div class="section">
          <div class="section-head"><span class="legend" data-t="guests"></span><span class="count" id="count"></span></div>
          <div class="guests" id="guests"></div>
          <button type="button" class="link" id="add"></button>
        </div>

        <label class="consent" for="consent">
          <input type="checkbox" id="consent" aria-describedby="consentErr">
          <span><span data-t="consent"></span><span class="err" id="consentErr" style="display:block"></span></span>
        </label>

        <div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>

        <button class="btn" id="submit" type="submit"></button>
        <div class="form-err" id="formErr" role="alert"></div>
        <p class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg><span data-t="privacy"></span></p>
      </form>

      <div class="done" id="done" hidden>
        <div class="done-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#D2AF1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2 id="doneTitle"></h2>
        <p id="doneText"></p>
        <span class="when" id="doneWhen"></span>
        <p data-t="donePray" style="margin-top:12px"></p>
        <button type="button" class="btn ghost" id="again" data-t="again"></button>
      </div>
    </section>
  </main>

  <footer class="sign">
    <span id="slogan"></span>
    <a href="https://vasesdhonneur.org" target="_blank" rel="noopener">vasesdhonneur.org</a>
  </footer>
</div>

<script>
/* ============ RÉGLAGES ============
   KALEO_API : l'URL de l'application Web Google Apps Script (Déployer → URL se terminant par /exec).
   Tant qu'elle n'est pas collée, la page tourne en mode démo : rien n'est enregistré. */
var KALEO_API = "https://script.google.com/macros/s/AKfycbx19F3p27Jhh6cFZr9mXV6T3C7dYeqpHzt3XzIuWXcr6AE8ZCGxxTj6UMchai_V7niY/exec";
var CONFIG = {
  timeZone: "America/Edmonton",
  serviceHour: 10,
  maxGuests: 5,
  serviceTime: { fr: "10 h", en: "10 AM" },
  address: { fr: "8830, 62e Avenue NO, Edmonton", en: "8830 62 Ave NW, Edmonton" }
};
/* ================================== */

var T = {
  fr: {
    tagline: ["Inviter", "Connecter", "Préparer", "Accueillir"],
    title: "Qui <span style=\"white-space:nowrap\">vas-tu</span> inviter <em>dimanche</em>&nbsp;?", address: CONFIG.address.fr,
    lead: "Pense à un ami, un collègue, un voisin. Laisse-nous son nom et son numéro : notre équipe l'appellera cette semaine pour l'inviter personnellement.",
    verse: "« Viens, et vois. »", verseRef: "Jean 1.46",
    demo: "Mode démo · rien n'est enregistré",
    yourName: "Ton nom", yourNameHint: "Pour savoir qui a lancé l'invitation.", yourNamePh: "Prénom et nom",
    guests: "Tes invités", guest: "Invité", guestName: "Nom de la personne", guestNamePh: "Prénom et nom",
    phone: "Téléphone", phonePh: "780 555 0123", remove: "Retirer",
    add: "+ Ajouter une personne", count: function (n, m) { return n + " sur " + m; },
    consent: "Ces personnes sont d'accord pour recevoir un appel de l'église.",
    submit: function (n) { return n > 1 ? "Envoyer les " + n + " invitations" : "Envoyer l'invitation"; },
    sending: "Envoi en cours…",
    privacy: "Ces numéros servent uniquement à les inviter. Seule l'équipe de mobilisation y a accès.",
    errInviter: "Écris ton nom.", errName: "Écris le nom de la personne.", errPhone: "Ce numéro semble incomplet.",
    errConsent: "Coche la case pour confirmer leur accord.",
    errNetwork: "L'envoi n'a pas abouti. Vérifie ta connexion, puis réessaie.",
    errBusy: "Beaucoup d'envois en ce moment. Réessaie dans quelques minutes.",
    errServer: "L'envoi n'a pas abouti. Réessaie dans un instant.",
    doneTitle: function (f) { return "Merci, " + f + "&nbsp;!"; },
    doneText: function (names) { return "Notre équipe appellera " + names + " cette semaine."; },
    donePray: "Continue de prier pour ces personnes, et accompagne-les dimanche si tu peux.",
    and: "et", again: "Inviter quelqu'un d'autre",
    slogan: "Partager l'amour de <b>Christ</b> pour changer le monde",
    sunday: function (d) { return fmtDate(d, "fr-CA") + " · " + CONFIG.serviceTime.fr; }
  },
  en: {
    tagline: ["Invite", "Connect", "Prepare", "Welcome"],
    title: "Who will you invite this <em>Sunday</em>?", address: CONFIG.address.en,
    lead: "Think of a friend, a coworker, a neighbour. Leave us their name and number, and our team will call them this week with a personal invitation.",
    verse: "“Come and see.”", verseRef: "John 1:46",
    demo: "Demo mode · nothing is saved",
    yourName: "Your name", yourNameHint: "So we know who sent the invitation.", yourNamePh: "First and last name",
    guests: "Your guests", guest: "Guest", guestName: "Guest's name", guestNamePh: "First and last name",
    phone: "Phone", phonePh: "780 555 0123", remove: "Remove",
    add: "+ Add a person", count: function (n, m) { return n + " of " + m; },
    consent: "These people agreed to receive a call from the church.",
    submit: function (n) { return n > 1 ? "Send " + n + " invitations" : "Send the invitation"; },
    sending: "Sending…",
    privacy: "These numbers are only used to invite them. Only the outreach team can see them.",
    errInviter: "Enter your name.", errName: "Enter the person's name.", errPhone: "This number looks incomplete.",
    errConsent: "Check the box to confirm they agreed.",
    errNetwork: "The invitation didn't go through. Check your connection and try again.",
    errBusy: "Lots of invitations right now. Please try again in a few minutes.",
    errServer: "The invitation didn't go through. Please try again in a moment.",
    doneTitle: function (f) { return "Thank you, " + f + "!"; },
    doneText: function (names) { return "Our team will call " + names + " this week."; },
    donePray: "Keep praying for them, and bring them along on Sunday if you can.",
    and: "and", again: "Invite someone else",
    slogan: "Sharing the love of <b>Christ</b> to change the world",
    sunday: function (d) { return fmtDate(d, "en-CA") + " · " + CONFIG.serviceTime.en; }
  }
};

var DEMO = !/^https:\/\/script\.google\.com\//.test(KALEO_API);
var lang = "fr", openedAt = Date.now(), guestSeq = 0;
var $ = function (id) { return document.getElementById(id); };

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

/* Dimanche visé, à l'heure d'Edmonton : le prochain dimanche ; le jour même avant le culte, ce dimanche-là. */
function targetSunday() {
  var p = new Intl.DateTimeFormat("en-US", { timeZone: CONFIG.timeZone, year: "numeric", month: "numeric", day: "numeric", hour: "numeric", hourCycle: "h23", weekday: "short" }).formatToParts(new Date());
  var g = function (t) { for (var i = 0; i < p.length; i++) if (p[i].type === t) return p[i].value; };
  var wd = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(g("weekday"));
  var add = (7 - wd) % 7;
  if (add === 0 && +g("hour") >= CONFIG.serviceHour) add = 7;
  return new Date(Date.UTC(+g("year"), +g("month") - 1, +g("day") + add, 12));
}
function fmtDate(d, loc) {
  var s = new Intl.DateTimeFormat(loc, { timeZone: "UTC", weekday: "long", day: "numeric", month: "long" }).format(d);
  if (loc.indexOf("fr") === 0) s = s.replace(/^(\S+) 1 /, "$1 1er ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function digits(s) { return String(s || "").replace(/\D/g, ""); }
function phoneOk(raw) {
  var d = digits(raw), intl = /^\s*(\+|00)/.test(raw);
  return d.length === 10 || (d.length === 11 && d.charAt(0) === "1") || (intl && d.length >= 8 && d.length <= 15);
}
function prettyPhone(raw) {
  var d = digits(raw);
  if (d.length === 11 && d.charAt(0) === "1") d = d.slice(1);
  if (d.length === 10 && !/^\s*(\+|00)/.test(raw)) return "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6);
  return raw.trim();
}
function joinNames(list) {
  if (list.length < 2) return list.join("");
  return list.slice(0, -1).join(", ") + " " + T[lang].and + " " + list[list.length - 1];
}

function addGuest(focus) {
  var n = $("guests").children.length;
  if (n >= CONFIG.maxGuests) return;
  var id = ++guestSeq, t = T[lang];
  var el = document.createElement("div");
  el.className = "guest"; el.dataset.id = id;
  el.innerHTML =
    '<div class="guest-head"><span class="tag"></span><button type="button" class="rm"></button></div>' +
    '<div class="guest-fields">' +
      '<div class="field"><label for="gn' + id + '" data-gt="guestName"></label><input id="gn' + id + '" type="text" maxlength="80" autocomplete="off" data-role="name"><span class="err"></span></div>' +
      '<div class="field"><label for="gp' + id + '" data-gt="phone"></label><input id="gp' + id + '" type="tel" inputmode="tel" maxlength="24" autocomplete="off" data-role="phone"><span class="err"></span></div>' +
    '</div>';
  el.querySelector(".rm").addEventListener("click", function () { el.remove(); refresh(); });
  el.querySelector('[data-role="phone"]').addEventListener("blur", function (e) { if (phoneOk(e.target.value)) e.target.value = prettyPhone(e.target.value); });
  $("guests").appendChild(el);
  refresh();
  if (focus) el.querySelector("input").focus();
}

function refresh() {
  var t = T[lang], rows = $("guests").children, n = rows.length;
  for (var i = 0; i < n; i++) {
    var r = rows[i];
    r.querySelector(".tag").textContent = t.guest + " " + (i + 1);
    var rm = r.querySelector(".rm"); rm.textContent = t.remove; rm.hidden = n === 1;
    r.querySelector('[data-gt="guestName"]').textContent = t.guestName;
    r.querySelector('[data-gt="phone"]').textContent = t.phone;
    r.querySelector('[data-role="name"]').placeholder = t.guestNamePh;
    r.querySelector('[data-role="phone"]').placeholder = t.phonePh;
  }
  $("count").textContent = t.count(n, CONFIG.maxGuests);
  $("add").textContent = t.add;
  $("add").hidden = n >= CONFIG.maxGuests;
  if (!$("submit").disabled) $("submit").textContent = t.submit(n);
}

function setLang(l) {
  lang = l; store("kaleo.lang", l);
  document.documentElement.lang = l;
  var t = T[l];
  document.querySelectorAll("[data-t]").forEach(function (el) { el.innerHTML = t[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.lang === l); });
  $("tagline").innerHTML = t.tagline.map(function (w) { return "<span>" + w + "</span>"; }).join('<i aria-hidden="true"></i>');
  $("tagline").setAttribute("aria-label", t.tagline.join(", "));
  $("inviter").placeholder = t.yourNamePh;
  $("eventDate").textContent = t.sunday(targetSunday());
  $("slogan").innerHTML = t.slogan;
  clearErrors();
  refresh();
}

function setErr(input, msg) {
  input.setAttribute("aria-invalid", msg ? "true" : "false");
  var e = input.id === "consent" ? $("consentErr") : input.parentNode.querySelector(".err");
  if (e) e.textContent = msg || "";
}
function clearErrors() {
  document.querySelectorAll("[aria-invalid]").forEach(function (i) { setErr(i, ""); });
  $("formErr").textContent = "";
}

function validate() {
  var t = T[lang], first = null, guests = [];
  clearErrors();
  var inv = $("inviter");
  if (inv.value.trim().length < 2) { setErr(inv, t.errInviter); first = first || inv; }
  Array.prototype.forEach.call($("guests").children, function (r) {
    var nm = r.querySelector('[data-role="name"]'), ph = r.querySelector('[data-role="phone"]');
    if (!nm.value.trim() && !ph.value.trim() && $("guests").children.length > 1) return; // ligne vide ignorée
    if (nm.value.trim().length < 2) { setErr(nm, t.errName); first = first || nm; }
    if (!phoneOk(ph.value)) { setErr(ph, t.errPhone); first = first || ph; }
    guests.push({ name: nm.value.trim(), phone: ph.value.trim() });
  });
  if (!guests.length) { var g0 = $("guests").querySelector('[data-role="name"]'); setErr(g0, t.errName); first = first || g0; }
  var c = $("consent");
  if (!c.checked) { setErr(c, t.errConsent); first = first || c; }
  if (first) { first.focus(); return null; }
  return guests;
}

function send(payload) {
  if (DEMO) return new Promise(function (res) { setTimeout(function () { res({ ok: true, count: payload.guests.length }); }, 900); });
  return fetch(KALEO_API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), redirect: "follow" })
    .then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); });
}

$("form").addEventListener("submit", function (e) {
  e.preventDefault();
  var guests = validate();
  if (!guests) return;
  var t = T[lang], btn = $("submit");
  btn.disabled = true; btn.innerHTML = '<span class="spin" aria-hidden="true"></span>' + t.sending;
  var inviter = $("inviter").value.trim();
  store("kaleo.inviter", inviter);
  send({ action: "invite", inviter: inviter, guests: guests, consent: true, lang: lang, website: $("website").value, elapsed: Date.now() - openedAt })
    .then(function (r) {
      if (!r || !r.ok) throw new Error(r && r.error || "server");
      showDone(inviter, guests.map(function (g) { return g.name.split(/\s+/)[0]; }));
    })
    .catch(function (err) {
      var m = String(err && err.message);
      $("formErr").textContent = m === "busy" ? t.errBusy : m === "server" || m === "invalid" ? t.errServer : t.errNetwork;
    })
    .then(function () { btn.disabled = false; refresh(); });
});

function showDone(inviter, firstNames) {
  var t = T[lang];
  $("doneTitle").innerHTML = t.doneTitle(esc(inviter.split(/\s+/)[0]));
  $("doneText").textContent = t.doneText(joinNames(firstNames));
  $("doneWhen").textContent = t.sunday(targetSunday());
  $("form").hidden = true; $("done").hidden = false;
  $("done").querySelector("h2").setAttribute("tabindex", "-1"); $("done").querySelector("h2").focus();
}

$("again").addEventListener("click", function () {
  $("guests").innerHTML = ""; $("consent").checked = false; openedAt = Date.now();
  addGuest(false);
  $("done").hidden = true; $("form").hidden = false;
  $("guests").querySelector("input").focus();
});
$("add").addEventListener("click", function () { addGuest(true); });
document.querySelectorAll(".lang button").forEach(function (b) { b.addEventListener("click", function () { setLang(b.dataset.lang); }); });

(function init() {
  $("demoTag").hidden = !DEMO;
  $("inviter").value = store("kaleo.inviter") || "";
  addGuest(false);
  var saved = store("kaleo.lang");
  setLang(saved === "en" || saved === "fr" ? saved : (navigator.language || "fr").slice(0, 2) === "en" ? "en" : "fr");
})();
</script>
</body>
</html>
